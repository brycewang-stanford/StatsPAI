# Pre-commit hooks for StatsPAI.
#
# Install once — this wires BOTH the commit-time and push-time stages thanks to
# ``default_install_hook_types`` below (no separate ``--hook-type pre-push``):
#
#     pre-commit install
#
# Stage layout — mirror the cheap CI gates locally so the self-inflicted CI
# reds (registry / schema / examples drift, lazy-import regressions) are caught
# BEFORE they reach GitHub, while keeping commits snappy:
#
#   * pre-commit — formatting + hard syntax errors (fast, auto-fixing). Every
#                  inherited hook pins ``stages: [pre-commit]`` EXPLICITLY: the
#                  pre-commit-hooks manifest hard-codes ``stages`` (incl. push)
#                  for trailing-whitespace / end-of-file-fixer / large-files, so
#                  a config-level ``default_stages`` alone does NOT confine them
#                  (verified empirically) — the per-hook override does.
#   * pre-push   — deterministic drift / contract guards that mirror
#                  parity-guards.yml + the ci-cd import-budget job (~10 s total).
#                  None of these modify files.
#   * manual     — the heavy 1000+ runnable-examples sweep (CI owns it; run on
#                  demand: ``pre-commit run examples-runnable --hook-stage manual``)
#
# Two protections worth noting:
#   1. trailing-whitespace / end-of-file-fixer carry an ``exclude`` for every
#      reference-data tree (parity fixtures, benchmark JSON, NIST .dat). Those
#      are byte-exact anchors from R / Stata / NIST — a whitespace "fix" would
#      corrupt a numerical-parity baseline (JOSS-sensitive). Never let an
#      auto-fixer rewrite them.
#   2. The mypy COUNT ratchet (scripts/quality_gate.py) is NOT mirrored here:
#      it depends on which third-party packages are installed and takes
#      minutes. It lives only in CI's pinned canonical env.
#      The flake8 COUNT ratchet IS mirrored, at pre-push (hook
#      ``flake8-count`` below), since 2026-10-03. It used to be CI-only for
#      the same reason, and the result was that nobody saw a long line
#      locally: main went from 929 to 1120 in a week and the gate, which
#      fails before mypy and pytest run, kept CI from testing anything from
#      09-28 to 10-03. The day it was brought back to 855, a push added 15
#      long strings within the hour. CI now runs flake8 7.3 and a local 7.3
#      reports the same count (1120 and 855 were both read identically on
#      both sides). If your local flake8 disagrees with CI, align the version
#      (``pip install "flake8==7.3.0"``) instead of skipping the hook.
#      The pinned flake8 pre-commit hook below (hard-error select) stays.

default_install_hook_types: [pre-commit, pre-push]

# Reference-data trees that must never be touched by an auto-fixing hook.
# Anchored, used by trailing-whitespace / end-of-file-fixer below.
# YAML anchor so the two hooks share one definition.
exclude: &refdata_exclude |
  (?x)^(
      benchmarks/
    | tests/fixtures/
    | tests/agent_bench/
    | tests/coverage_monte_carlo/
    | tests/numerical_accuracy/
    | tests/orig_parity/
    | tests/perf/results/
    | tests/r_parity/
    | tests/stata_parity/
    | tests/reference_parity/_fixtures/
    | tests/spatial/fixtures/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: *refdata_exclude
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: *refdata_exclude
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]

  # Pinned to the version the dev extra installs and CLAUDE.md 14's
  # `black src tests` therefore runs. They were 23.9.1 and 26.5.1
  # respectively, and the two disagree about conditional-expression
  # wrapping, so every commit through the hook pushed files further from
  # what the documented command produces: the count of files the two
  # versions disagreed about grew from 12 to 66 over one working session.
  # Nothing in CI runs black, so the hook was the only enforcement and it
  # was enforcing a different style from the one the repo is written in.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        # Hard syntax / undefined-name breakage only — must be zero on every
        # interpreter. The full violation-COUNT ratchet is CI-only (pinned env,
        # see note at top of file).
        args: ["--select=E9,F63,F7,F82", "--show-source", "--statistics"]
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        # ``--severity-level medium`` mirrors the canonical CI gate
        # (ci-cd.yml: ``bandit -r src/ -f json --severity-level medium``).
        # Without it the hook gated on bandit's ~345 LOW findings (asserts,
        # try/except/pass, subprocess) — pre-existing noise that CI itself does
        # NOT block on, so the un-gated hook was STRICTER than CI and aborted
        # every commit. Keep medium+ as the real gate; let LOW stay advisory.
        #
        # ``pass_filenames: false`` is REQUIRED here: ``-r src/`` already
        # declares a full recursive scan, so the staged-file list pre-commit
        # would otherwise append is redundant — and with an option in front of
        # it (``--severity-level medium``) argparse splits the ``targets``
        # positional and rejects the trailing files ("unrecognized arguments").
        # Dropping the filename list runs exactly ``bandit -r src/
        # --severity-level medium``, identical to CI.
        args: [-r, src/, --severity-level, medium]
        pass_filenames: false
        exclude: ^tests/
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Local CI-mirror guards (pre-push stage). ``language: system`` runs them in
  # the active env — they need ``pip install -e ".[dev]"``. Every one is
  # deterministic (same result locally and in CI) and fast (<4 s each measured
  # at v1.20.0), reads only / never writes, so they gate ``git push`` without
  # the ~1 h pytest sweep that made the old full-pytest hook unusable (and
  # uninstalled). These mirror the checks that actually red the build between
  # releases: parity-guards.yml's registry/schema/examples drift gates and
  # ci-cd.yml's import-budget job.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: bib-packaged-sync
        name: bib_subset packaged --check (wheel copy of paper.bib in sync)
        # The wheel ships src/statspai/paper.bib so sp.bibtex() resolves on a
        # pip install; it must stay byte-identical to the root master. Fix
        # with: python3 tools/bib_subset.py packaged --sync
        entry: python3 tools/bib_subset.py packaged --check
        language: system
        pass_filenames: false
        files: ^(paper\.bib|src/statspai/paper\.bib)$
        stages: [pre-commit]

      - id: bib-subset-jss
        name: bib_subset check (JSS jss-bib.bib derived from paper.bib)
        # Paper-JSS/ is git-ignored, so this only runs where the manuscript
        # exists (--skip-missing); CI cannot see it. Regenerate with
        # `make -C Paper-JSS bib-split`.
        entry: python3 tools/bib_subset.py check --skip-missing --roots Paper-JSS/manuscript/main.tex --out Paper-JSS/manuscript/jss-bib.bib --keep brown2020language rios2022csdid
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bib-subset-jss-archival
        name: bib_subset check (JSS jss-bib-archival.bib = cited anywhere minus jss-bib.bib)
        entry: bash -c 'python3 tools/bib_subset.py check --skip-missing --roots Paper-JSS/manuscript/main.tex Paper-JSS/manuscript/sections/*.tex --minus Paper-JSS/manuscript/jss-bib.bib --out Paper-JSS/manuscript/jss-bib-archival.bib'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: guides-packaged-sync
        name: packaged estimator-choice guides == docs/guides (sp.decision_guide / statspai://guide)
        entry: python3 scripts/sync_guides.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: flake8-count
        name: quality_gate flake8 (violation-count ratchet, same as CI)
        entry: python3 scripts/quality_gate.py flake8
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: registry-drift
        name: registry_stats --check (public-function / submodule drift)
        entry: python3 scripts/registry_stats.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: release-gate
        name: release_gate --check (ASCII-safe patterns, packaged wording; census while a release is being cut)
        # The census part only runs between the version bump and the tag, so
        # it never fires on an ordinary push while other lines add functions.
        entry: python3 scripts/release_gate.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: jss-review-freeze
        name: jss_review_freeze --check (every commit to a frozen JSS artifact is logged)
        # Per commit, so it cannot run at pre-commit: the ledger entry names
        # the SHA of the commit it covers and lands in a follow-up commit.
        entry: python3 scripts/jss_review_freeze.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: evidence-inventory
        name: build_evidence_inventory --check (configuration x output evidence view, option-fixture hashes)
        entry: python3 scripts/build_evidence_inventory.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: schema-drift
        name: dump_schemas --check (MCP cold-start bundle drift)
        entry: python3 scripts/dump_schemas.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: error-taxonomy
        name: error_taxonomy_audit --check (exception-taxonomy ratchet)
        entry: python3 scripts/error_taxonomy_audit.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: orchestration-assertions
        name: orchestration_assertion_audit --check (smoke-only test ratchet)
        entry: python3 scripts/orchestration_assertion_audit.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: silent-except
        name: silent_except_audit --check (silent broad-except ratchet)
        entry: python3 scripts/silent_except_audit.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: examples-coverage
        name: examples_coverage --check (docstring Examples presence, budget 0)
        entry: python3 scripts/examples_coverage.py --check --max-missing 0
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Both trace ledgers bind each parity module to the hashes of the
      # StatsPAI sources it executes and of its committed result. A source
      # edit that re-records neither leaves the ledger describing code that
      # no longer exists. Until 2026-10-05 nothing checked this before a
      # push: the original-data ledger went stale on main under two parallel
      # lines of work, and one result (LaLonde psm_att) no longer reproduced.
      # Hash comparisons and one table re-tabulation, about 3 s. A failure
      # names the modules; re-run them, diff the result against the
      # committed one, then `python scripts/trace_parity_provenance.py NN`
      # (add `--ledger orig` for tests/orig_parity).
      - id: parity-traces
        name: parity trace ledgers describe the tree (Track A + original data)
        entry: >-
          python3 -m pytest -q --no-header -o addopts= -p no:cacheprovider
          tests/test_parity_implementation_provenance.py::test_every_module_is_traced_and_the_trace_is_current
          tests/test_orig_parity_native_contract.py::test_every_module_is_traced_and_the_trace_is_current
          tests/test_orig_parity_harness_contract.py::test_orig_parity_rollup_is_reproducible_from_committed_json
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # An argument added to a registered function without a ParamSpec is
      # invisible to sp.function_schema() and so to every agent. The test
      # was CI-only: lm_lin(blocks=) and tobit(formula=) reached main that
      # way on 2026-10-05. About 2 s. The fix is a ParamSpec in registry.py
      # whose description is the agent-facing documentation, then
      # `python scripts/dump_schemas.py`.
      - id: registry-params
        name: every argument of a registered function is in its schema
        entry: >-
          python3 -m pytest -q --no-header -o addopts= -p no:cacheprovider
          tests/test_registry_param_drift.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: import-budget
        name: cold-import budget (lazy-import contract — 0 heavy submodules)
        entry: python3 -m pytest tests/test_import_budget.py -q --no-header -o addopts=
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Heavy: executes 1000+ docstring examples (>2 min). CI's parity-guards
      # workflow owns this gate; run locally on demand only:
      #     pre-commit run examples-runnable --hook-stage manual
      - id: examples-runnable
        name: check_example_execution (docstring Examples runnability)
        entry: python3 scripts/check_example_execution.py --quiet --max-failures 0
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
